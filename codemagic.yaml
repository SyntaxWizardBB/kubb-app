# Codemagic CI/CD — iOS build & TestFlight for Kubb Club.
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# Prerequisites (one-time, in the Codemagic UI / Apple portals):
#   - App Store Connect API key uploaded to Codemagic, named `KubClubAppStore`
#     (Team settings -> Integrations -> App Store Connect).
#   - App ID `ch.kubbclub.app` registered in the Apple Developer portal, and an
#     app record created in App Store Connect (required for TestFlight upload).
#   - Environment group `supabase` holding SUPABASE_URL + SUPABASE_ANON_KEY.
#   - `ios/Runner/GoogleService-Info.plist` committed (needed once push lands).
workflows:
  ios-testflight:
    name: iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: KubClubAppStore
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ch.kubbclub.app
      groups:
        - supabase # provides SUPABASE_URL + SUPABASE_ANON_KEY
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        # The ios_signing block (above) auto-fetches the distribution certificate
        # + provisioning profile during build prep; this wires them into the
        # Xcode project. NOTE: Codemagic does NOT create the Apple Distribution
        # certificate during the build — it must already exist in the team's
        # Code signing identities. Generate it once in the Codemagic UI (it uses
        # the KubClubAppStore API key to mint it in the Apple account).
        script: xcode-project use-profiles
      - name: Flutter pub get
        script: flutter pub get
      - name: Build signed IPA
        # `flutter build ipa` generates the Podfile + runs pod install on first run.
        # $BUILD_NUMBER (Codemagic's monotonic index) keeps TestFlight builds unique.
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        # Inherit the API key from the integrations block above.
        auth: integration
        # Needs the app record to exist in App Store Connect, else the upload
        # step fails — flip to false for the very first "does it build" run.
        submit_to_testflight: true

  android-appdist:
    name: Android · App Distribution
    # Android needs no Mac; a Linux instance is cheaper and faster.
    instance_type: linux_x2
    max_build_duration: 60
    # No triggering block -> start manually in the Codemagic UI, same as the
    # iOS workflow. To auto-build a release cut instead, add a triggering block
    # that fires on tag pushes (needs the repo's build-trigger/webhook wired in
    # the Codemagic UI first):
    #   triggering:
    #     events:
    #       - tag
    #     tag_patterns:
    #       - pattern: 'release/*'
    #         include: true
    environment:
      # OWNER: upload the upload keystore in Codemagic under Code signing
      # identities -> Android keystores, then put its reference name here.
      # This attaches the keystore and emits CM_KEYSTORE_PATH / CM_KEY_ALIAS /
      # CM_KEYSTORE_PASSWORD / CM_KEY_PASSWORD, which android/app/build.gradle.kts
      # reads for the release signingConfig.
      android_signing:
        - kubb_upload_keystore # OWNER: Codemagic Android keystore reference name
      groups:
        - supabase # provides SUPABASE_URL + SUPABASE_ANON_KEY
      flutter: stable
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Build signed APK
        # $PROJECT_BUILD_NUMBER (Codemagic's project-wide, monotonic index)
        # becomes the Android versionCode, so App Distribution never rejects a
        # duplicate on re-upload.
        script: |
          flutter build apk --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      firebase:
        # OWNER: create a Firebase service account with the "Firebase App
        # Distribution Admin" role, download its JSON key, and store the whole
        # JSON as a secured env var named FIREBASE_SERVICE_ACCOUNT in Codemagic
        # (Team- or app-level environment variables, "Secure" enabled).
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          # Firebase app id for ch.kubbclub.app — mobilesdk_app_id from
          # android/app/google-services.json (Firebase project kubbclubapp).
          app_id: 1:106001380567:android:72f4f1f0989d54b996ac92
          artifact_type: apk
          groups:
            - testers # OWNER: tester group alias, created in the Firebase console
