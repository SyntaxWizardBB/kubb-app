name: kubb_app
description: "Kubb Club — Kubb tournament & training management"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: any

  kubb_domain:
    path: packages/kubb_domain

  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  go_router: ^17.5.0

  drift: ^2.34.3
  path_provider: ^2.1.6
  path: any

  supabase_flutter: ^2.5.0
  flutter_secure_storage: ^8.1.0
  cryptography: ^2.7.0
  bip39: ^1.0.6
  app_links: ^7.2.1
  connectivity_plus: ^7.3.1

  # Push (P3): FlutterFire pulls the native FCM SDK; google-services plugin
  # supplies the Android config, so Firebase.initializeApp() needs no options.
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

  reactive_forms: ^18.2.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  uuid: ^4.6.0
  logging: ^1.3.0
  collection: any

  url_launcher: ^6.3.2
  # lucide_icons (0.257.0, abandoned) breaks on Flutter >=3.41: it extends
  # the now-final IconData. lucide_icons_flutter is the maintained successor.
  lucide_icons_flutter: ^3.1.14
  package_info_plus: ^10.1.0
  fl_chart: ^1.2.0
  share_plus: ^13.1.0
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^10.3.0
  sqlite3: ^3.5.2
  supabase: ^2.16.1

  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  riverpod_generator: ^4.0.8
  riverpod_lint: ^3.1.8
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  golden_toolkit: ^0.15.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - docs/legal/privacy-policy-de.md
    - docs/legal/imprint-de.md
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-VariableFont.ttf
